<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>Ward Bloods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F5F4;--surface:#FFFFFF;--surface-2:#EDF2F0;--ink:#15201C;--muted:#5A6762;--line:#D5DDD9;--line-2:#E6ECE9;
  --accent:#23665A;--accent-ink:#FFFFFF;--accent-soft:#DCEBE7;
  --hi:#B42318;--hi-bg:#FCEBE9;--lo:#1D5FA8;--lo-bg:#E7EFFA;--warn-bg:#FFF6DD;--warn-ink:#6B4E00;
  --ch-bg:#FFF2CC;--ch-line:#E3B341;--ch-ink:#3F2E00;--ch-strong:#8A5A00;--ch-item:#FFFBEF;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1B2521;--ink:#E3EBE7;--muted:#93A29C;--line:#2A3631;--line-2:#222D29;
  --accent:#62B4A2;--accent-ink:#08110E;--accent-soft:#1D3530;
  --hi:#FF8C7C;--hi-bg:#3A1C18;--lo:#8DBBF2;--lo-bg:#152539;--warn-bg:#352C12;--warn-ink:#F1D98A;
  --ch-bg:#2A220E;--ch-line:#8C6B1C;--ch-ink:#F4E2AE;--ch-strong:#F2C14E;--ch-item:#211B0C;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1B2521;--ink:#E3EBE7;--muted:#93A29C;--line:#2A3631;--line-2:#222D29;
  --accent:#62B4A2;--accent-ink:#08110E;--accent-soft:#1D3530;
  --hi:#FF8C7C;--hi-bg:#3A1C18;--lo:#8DBBF2;--lo-bg:#152539;--warn-bg:#352C12;--warn-ink:#F1D98A;
  --ch-bg:#2A220E;--ch-line:#8C6B1C;--ch-ink:#F4E2AE;--ch-strong:#F2C14E;--ch-item:#211B0C;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}

/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-inline:14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-inline:4px}
.brand h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--hi);border-color:var(--hi)}
.btn.danger.armed{background:var(--hi);color:var(--surface)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.plist button{width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.plist button:hover{background:var(--surface-2)}
.plist button[aria-current="true"]{background:var(--accent-soft)}
.plist .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .sub{grid-column:1/-1;font-size:12px;color:var(--muted);font-family:var(--mono)}
.badge{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:10px;background:var(--hi-bg);color:var(--hi);align-self:center}
.status{margin-top:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-inline:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.status.ok .dot{background:var(--accent)}
.status.busy .dot{background:#C08A00}
.status.local .dot{background:#C08A00}

/* Main */
.main{padding-block:22px 60px;padding-inline:28px;min-width:0;display:flex;flex-direction:column;gap:16px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 14px;font-size:13px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.phead h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toolbar input[type=datetime-local]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.card>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
details.card>summary::-webkit-details-marker{display:none}
.chev{width:14px;height:14px;flex:none;transition:transform .15s;color:var(--muted)}
details[open]>summary .chev{transform:rotate(90deg)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 16px;padding:4px 16px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;min-width:0}
.hint{padding:0 16px 14px;font-size:12.5px;color:var(--muted)}

.sectlabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 -6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:2px 4px;text-transform:none;letter-spacing:0}
.panel summary .sys{font-weight:400;font-size:12px;color:var(--muted);font-family:var(--mono)}
.panel summary .flags{margin-left:auto;display:flex;gap:6px}
.chip{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:10px;font-weight:500}
.chip.hi{background:var(--hi-bg);color:var(--hi)}
.chip.lo{background:var(--lo-bg);color:var(--lo)}
.twrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
th,td{border-bottom:1px solid var(--line-2);padding:0;text-align:left;vertical-align:middle}
thead th{font-size:11.5px;color:var(--muted);font-weight:500;padding:8px 10px;background:var(--surface-2);white-space:nowrap}
.c-test{position:sticky;left:0;z-index:1;background:var(--surface);min-width:150px;max-width:190px;padding:6px 10px;font-weight:500;border-right:1px solid var(--line)}
thead .c-test{background:var(--surface-2);z-index:2}
.c-u,.c-r{padding:6px 10px;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.c-sp{padding:4px 10px}
.c-sp svg{display:block}
.colh{min-width:92px;position:relative;font-family:var(--mono)}
.colh .d{color:var(--ink);font-weight:500}
.colh .x{position:absolute;top:4px;right:4px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:1px 4px;border-radius:4px;opacity:.5}
.colh:hover .x,.colh .x:focus-visible,.colh .x.armed{opacity:1}
.colh .x.armed{background:var(--hi);color:var(--surface);font-family:var(--sans)}
td.v{position:relative;border-left:1px solid var(--line-2)}
td.v input{width:100%;min-width:92px;border:0;background:transparent;padding:8px 22px 8px 10px;font-family:var(--mono);font-size:13.5px}
td.v input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
td.v.hi{background:var(--hi-bg)} td.v.hi input{color:var(--hi);font-weight:500}
td.v.lo{background:var(--lo-bg)} td.v.lo input{color:var(--lo);font-weight:500}
td.v.hi::after,td.v.lo::after{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;pointer-events:none}
td.v.hi::after{content:"↑";color:var(--hi)} td.v.lo::after{content:"↓";color:var(--lo)}
.rmrow{border:0;background:none;color:var(--muted);cursor:pointer;margin-left:4px;font-size:12px}
.empty{padding:14px 16px;color:var(--muted);font-size:13px}
.addtest{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:1px solid var(--line-2)}
.addtest input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;min-width:0;width:170px}
.addtest input.u{width:90px}

.notes{display:flex;flex-direction:column;gap:0;padding:0 16px 14px}
.note{display:grid;grid-template-columns:130px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);align-items:start}
.note time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
.note p{margin:0;white-space:pre-wrap;max-width:70ch}
.noteform{display:flex;gap:8px;padding:10px 16px 16px;flex-wrap:wrap}
.noteform textarea{flex:1 1 260px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;min-height:42px;resize:vertical}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:12.5px;margin-top:6px}
.welcome{max-width:560px;padding:40px 0}
.welcome h2{font-size:22px;margin:0 0 8px}
.welcome p{color:var(--muted);margin:0 0 16px}

.colh .d.eb{border:0;background:none;padding:0;cursor:pointer;font:inherit;font-weight:500;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px}
.notmeas{font-size:12.5px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line-2)}
.nodata{color:var(--muted);font-size:13px;margin:0}
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.4);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);margin:0}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-size:17px;flex:1}
.sbody{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.sbody .field input{background:var(--surface)}
.ptabs{display:flex;gap:6px;flex-wrap:wrap}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.ptabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ptabs .n{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:0 6px}
.ptabs button[aria-selected="true"] .n{background:var(--accent-ink);color:var(--accent)}
.erows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.erow{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:7px 10px 7px 14px;border-top:1px solid var(--line-2)}
.erow:first-child{border-top:0}
.erow label{display:flex;flex-direction:column;font-weight:500}
.erow label small{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400}
.erow input{height:40px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:0 10px;font-family:var(--mono);font-size:15px;text-align:right;width:100%}
.erow input.hi{border-color:var(--hi);color:var(--hi);background:var(--hi-bg);font-weight:500}
.erow input.lo{border-color:var(--lo);color:var(--lo);background:var(--lo-bg);font-weight:500}
.sfoot{display:flex;gap:8px;align-items:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.sfoot .grow{margin-right:auto}
.shint{font-size:12.5px;color:var(--muted);margin:0}
.shint.ferr{color:var(--hi)}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbody .field textarea,.sbody .field select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0;font:inherit;resize:vertical}
.rep summary .sys{font-weight:400;font-size:12px;color:var(--muted);font-family:var(--mono)}
.rep summary .flags{margin-left:auto;display:flex;gap:6px}
.chase{background:var(--ch-bg);border:1.5px solid var(--ch-line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;color:var(--ch-ink)}
.chead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chead h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ch-strong)}
.chead .ccount{font-family:var(--mono);font-size:12px}
.chead .cover{font-family:var(--mono);font-size:11.5px;background:var(--hi);color:#fff;border-radius:10px;padding:1px 8px}
.chead .cpt{margin-left:auto}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.citem{display:grid;grid-template-columns:24px auto 1fr auto auto;gap:10px;align-items:center;background:var(--ch-item);border:1px solid color-mix(in srgb,var(--ch-line) 55%,transparent);border-radius:8px;padding:8px 10px}
.citem.over{border-color:var(--hi)}
.citem.auto{border-style:dashed}
.cbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--ch-strong);background:transparent;cursor:pointer;padding:0;color:var(--ch-strong);font-weight:700;line-height:1}
.cbox:hover{background:color-mix(in srgb,var(--ch-strong) 18%,transparent)}
.cbox.dash{border-style:dashed;cursor:default;background:none}
.cbox.on{background:var(--ch-strong);color:var(--ch-bg)}
.ccat{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ch-strong);white-space:nowrap}
.ctext{min-width:0;color:var(--ink)}
.ctext em{font-style:normal;color:var(--muted);font-size:12.5px;margin-left:6px}
.cdue{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--ch-ink)}
.citem.over .cdue{color:var(--hi);font-weight:600}
.cdue.today{font-weight:600}
.citem .linkbtn{color:var(--ch-strong);font-weight:600}
.cnone{margin:0;font-size:13px}
.cadd{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px}
.cadd select,.cadd input{border:1px solid var(--ch-line);background:var(--ch-item);border-radius:7px;padding:7px 9px;min-width:0;color:var(--ink)}
.cdone summary{cursor:pointer;font-size:13px;color:var(--ch-strong)}
.cdone .clist{margin-top:6px}
.citem.done .ctext{text-decoration:line-through;color:var(--muted)}
.chasebtn{background:var(--ch-bg);border-color:var(--ch-line);color:var(--ch-strong);font-weight:600;justify-content:space-between}
.chasebtn[aria-current="true"]{outline:2px solid var(--ch-line)}
.chasebtn .n{font-family:var(--mono);background:var(--ch-strong);color:var(--ch-bg);border-radius:10px;padding:0 7px;font-size:12px}
.badge.ch{background:var(--ch-bg);color:var(--ch-strong);border:1px solid var(--ch-line)}
.plist .bdg{display:flex;gap:4px;align-self:center}
.cgroup{display:flex;flex-direction:column;gap:6px}
.cgroup h4{margin:6px 0 0;font-size:14px}
.cgroup h4 button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--ch-line);text-underline-offset:3px}
@media (max-width:620px){.cadd{grid-template-columns:1fr 1fr}.cadd #c_text{grid-column:1/-1;order:-1}.cadd button{grid-column:1/-1}.citem{grid-template-columns:24px 1fr auto;row-gap:4px}.citem>.cbox{grid-column:1;grid-row:1/3;align-self:start}.citem>.ctext{grid-column:2;grid-row:1}.citem>:last-child{grid-column:3;grid-row:1;align-self:start}.citem>.ccat{grid-column:2;grid-row:2}.citem>.cdue{grid-column:3;grid-row:2;text-align:right}}
.stabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--surface-2);border-radius:8px;padding:3px}
.stabs button{border:0;background:none;border-radius:6px;padding:6px 4px;cursor:pointer;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.25}
.stabs button span{font-family:var(--mono);font-size:11.5px}
.stabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pempty{font-size:12.5px;color:var(--muted);padding:8px 10px}
.sbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-radius:10px;padding:10px 14px;font-size:13.5px}
.sbanner.dis{background:var(--lo-bg);color:var(--ink)}
.sbanner.dis b{color:var(--lo)}
.sbanner.dec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.stact{display:flex;gap:8px;flex-wrap:wrap}
.stconf{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-width:640px;margin-left:auto}
.stconf h4{margin:0;font-size:15px}
.stconf .field input{background:var(--bg)}
.stwarn{background:var(--ch-bg);border:1px solid var(--ch-line);color:var(--ch-ink);border-radius:8px;padding:10px 12px;font-size:13px}
.stwarn ul{margin:6px 0 0;padding-left:18px}
.stbtns{display:flex;gap:8px;justify-content:flex-end}
@media (max-width:760px){.stabs{min-width:0}}
.todo{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.thead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.thead h3{margin:0;font-size:17px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.tcount{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tall{font-size:11.5px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:1px 8px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.titem{display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--accent-soft)}
.titem.done{background:transparent}
.titem.done .ttext{text-decoration:line-through;color:var(--muted)}
.titem.carried{background:var(--warn-bg)}
.tbox{width:24px;height:24px;border-radius:6px;border:2px solid var(--accent);background:var(--surface);cursor:pointer;padding:0;color:var(--accent-ink);font-weight:700;line-height:1;font-size:14px}
.tbox:hover{background:var(--accent-soft)}
.tbox.on{background:var(--accent);border-color:var(--accent)}
.ttext{min-width:0}
.ttext em{font-style:normal;font-size:12px;color:var(--muted);margin-left:8px}
.tdone{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tcarry p{margin:4px 0;font-size:12.5px;color:var(--warn-ink);font-weight:600}
.tadd{display:grid;grid-template-columns:1fr auto;gap:8px}
.tadd input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;min-width:0}

.rentry{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rhead time{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.rtitle{flex:1;min-width:180px}
.stp{font-size:11.5px;font-weight:500;border-radius:10px;padding:1px 8px;white-space:nowrap}
.stp.ok{background:var(--accent-soft);color:var(--accent)}
.stp.pend{background:var(--warn-bg);color:var(--warn-ink)}
.stp.prelim{background:var(--lo-bg);color:var(--lo)}

.org{margin:0;font-weight:600;max-width:75ch}
.res{margin:0;white-space:pre-wrap;max-width:75ch;color:var(--ink)}
.full summary{cursor:pointer;color:var(--accent);font-size:13px}

.sens.S{background:var(--accent-soft);border-color:transparent}.sens.S b{color:var(--accent)}
.sens.I{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink)}
.sens.R{background:var(--hi-bg);border-color:transparent;color:var(--hi)}
.repadd{padding:10px 16px 14px}
.files{display:flex;flex-wrap:wrap;gap:8px}

.fitem.pdf a{color:var(--accent);font-weight:500}

.frm{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:11px;line-height:1;color:var(--muted)}
.fitem.pdf .frm{position:static;margin-left:8px}

/* ---------- State ---------- */
const S={tab:"active",view:"patient",patients:{},cur:null,mode:"loading",db:null,col:null,dirty:new Set(),timers:{},writing:{},again:{},examples:null,loaded:false,openPanels:{}};
const LS_KEY="wardbloods.patients",LS_OPEN="wardbloods.open";
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
S.openPanels=lsGet(LS_OPEN)||{};
S.showAll=lsGet("wardbloods.showall")===true;

function setStatus(kind,text){const el=$("#status");el.className="status "+kind;$("#statusText").textContent=text;}
function refreshStatus(){
  if(S.mode==="cloud")setStatus(S.dirty.size?"busy":"ok",S.dirty.size?"Saving…":"Saved to your account · private to you");
  else if(S.mode==="supabase")setStatus(S.dirty.size?"busy":"ok",S.dirty.size?"Saving…":"Synced · "+SB.teamName);
  else if(S.mode==="local")setStatus("local",S.dirty.size?"Saving…":"Saved on this device only");
  else if(S.mode==="memory")setStatus("local","Not saved: storage unavailable");
  else setStatus("busy","Loading…");}

function ordered(){return Object.entries(S.patients).sort((a,b)=>(a[1].created||0)-(b[1].created||0));}
const stOf=p=>(p&&p.status)||"active";
function orderedBy(st){return ordered().filter(x=>stOf(x[1])===st);}
const ST_LABEL={active:"Active",discharged:"Discharged",deceased:"Deceased"};
const isEx=id=>typeof id==="string"&&id.startsWith("ex-");
function current(){if(isEx(S.cur))return S.examples?S.examples[S.cur]:null;return S.patients[S.cur]||null;}
function showExamples(){if(S.mode==="supabase"){S.examples=null;S.cur=null;return;}S.examples=makeExamples();S.cur="ex-1";}

/* ---------- Saving ---------- */
function touch(id){
  if(isEx(id))return;
  const p=S.patients[id];if(!p)return;p.updated=Date.now();
  S.dirty.add(id);refreshStatus();
  clearTimeout(S.timers[id]);S.timers[id]=setTimeout(()=>flush(id),650);}
async function flush(id){
  if(S.mode==="supabase")return sbFlush(id);
  if(S.mode==="local"||S.mode==="memory"){lsSet(LS_KEY,S.patients);S.dirty.delete(id);refreshStatus();renderSidebar();return;}
  if(S.writing[id]){S.again[id]=true;return;}
  const p=S.patients[id];if(!p){S.dirty.delete(id);refreshStatus();return;}
  S.writing[id]=true;
  try{await S.col.doc(id).set(JSON.parse(JSON.stringify(p)));}
  catch(e){console.warn(e);S.writing[id]=false;
    if(e&&e.code==="unavailable"){setTimeout(()=>flush(id),800+Math.random()*800);return;}
    setStatus("local","Couldn't save: "+(e&&e.code==="quota_exceeded"?"storage full":"check connection"));return;}
  S.writing[id]=false;
  if(S.again[id]){S.again[id]=false;return flush(id);}
  S.dirty.delete(id);refreshStatus();renderSidebar();}
async function removePatient(id){
  const p0=S.patients[id];delete S.patients[id];S.dirty.delete(id);clearTimeout(S.timers[id]);
  if(S.mode==="supabase"){await sbDelete(id,p0);}
  else if(S.mode==="cloud"){try{await S.col.doc(id).delete();}catch(e){console.warn(e);}}
  else lsSet(LS_KEY,S.patients);
  const list=orderedBy(S.tab);if(list.length)S.cur=list[list.length-1][0];else if(!ordered().length){S.tab="active";showExamples();}else S.cur=null;
  renderAll();}

/* ---------- Sidebar ---------- */
function renderSidebar(){
  {let n=0;const all=ordered().length?ordered().map(x=>x[1]).filter(p=>stOf(p)!=="deceased"):Object.values(S.examples||{});all.forEach(p=>n+=chaseCount(p));
   const cn=document.getElementById("chaseN");if(cn)cn.textContent=n;const cb=document.getElementById("chaseAll");if(cb)cb.setAttribute("aria-current",String(S.view==="chase"));}
  const list=orderedBy(S.tab);const nAct=orderedBy("active").length;
  $("#pcount").textContent=nAct?nAct+(nAct===1?" active":" active"):"";
  $("#stabs").innerHTML=["active","discharged","deceased"].map(t=>{const n=t==="active"&&!ordered().length&&S.examples?Object.keys(S.examples).length:orderedBy(t).length;
    return`<button type="button" role="tab" data-stab="${t}" aria-selected="${S.tab===t}">${ST_LABEL[t]} <span>${n}</span></button>`;}).join("");
  let h="";
  if(S.tab==="active"&&!ordered().length&&S.examples)for(const [id,p] of Object.entries(S.examples))h+=item(id,p,true);
  for(const [id,p] of list)h+=item(id,p,false);
  if(!h)h=`<li class="pempty">${S.tab==="discharged"?"No discharged patients. They move here with all their results when you discharge them.":S.tab==="deceased"?"No deceased patients.":"No active patients."}</li>`;
  $("#plist").innerHTML=h;}
function item(id,p,isEx){
  let hi=0,lo=0;for(const pn of PANELS){const f=latestFlags(p,pn);hi+=f.hi;lo+=f.lo;}
  const cols=sortedCols(p);const last=cols.length?fmtDT(cols[cols.length-1].dt):null;
  const st=stOf(p);const sd=st==="discharged"&&p.dischargedAt?"discharged "+fmtDT(p.dischargedAt).d:st==="deceased"&&p.diedAt?"died "+fmtDT(p.diedAt).d:"";
  const sub=[p.ward,sd||(last?"last "+last.d:"no samples")].filter(Boolean).join(" · ");
  const cn=chaseCount(p);
  return `<li><button type="button" data-p="${esc(id)}" aria-current="${S.view!=="chase"&&S.cur===id}"><span class="nm">${esc(p.name||"Unnamed patient")}</span><span class="bdg">${cn?`<span class="badge ch" title="Items to chase">${cn}</span>`:""}${hi+lo?`<span class="badge" title="Abnormal on latest sample">${hi+lo}</span>`:""}</span><span class="sub">${esc(sub)}</span></button></li>`;}

/* ---------- Sparkline ---------- */
function spark(p,t){
  const cols=sortedCols(p);const row=(p.v||{})[t.key]||{};const r=rangeFor(t,p.sex);
  const pts=[];cols.forEach((c,i)=>{const x=num(row[c.id]);if(!isNaN(x))pts.push({i,x,f:flag(row[c.id],r)});});
  const W=76,H=24,P=3;
  if(!pts.length)return`<svg width="${W}" height="${H}" aria-hidden="true"></svg>`;
  let mn=Math.min(...pts.map(q=>q.x)),mx=Math.max(...pts.map(q=>q.x));
  if(r){if(r[0]!=null)mn=Math.min(mn,r[0]);if(r[1]!=null)mx=Math.max(mx,r[1]);}
  if(mx===mn){mx+=1;mn-=1;}
  const n=Math.max(cols.length-1,1);
  const X=i=>P+(W-2*P)*(cols.length===1?0.5:i/n),Y=v=>H-P-(H-2*P)*(v-mn)/(mx-mn);
  let band="";
  if(r&&(r[0]!=null||r[1]!=null)){const y1=Y(r[1]!=null?r[1]:mx),y2=Y(r[0]!=null?r[0]:mn);band=`<rect x="0" y="${y1.toFixed(1)}" width="${W}" height="${Math.max(1,y2-y1).toFixed(1)}" fill="var(--accent-soft)"/>`;}
  const line=pts.length>1?`<polyline fill="none" stroke="var(--muted)" stroke-width="1.3" points="${pts.map(q=>X(q.i).toFixed(1)+","+Y(q.x).toFixed(1)).join(" ")}"/>`:"";
  const dots=pts.map((q,j)=>{const last=j===pts.length-1;const c=q.f==="hi"?"var(--hi)":q.f==="lo"?"var(--lo)":"var(--ink)";return last||q.f?`<circle cx="${X(q.i).toFixed(1)}" cy="${Y(q.x).toFixed(1)}" r="${last?2.6:1.8}" fill="${c}"/>`:"";}).join("");
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend">${band}${line}${dots}</svg>`;}

/* ---------- Main ---------- */
const CHEV=`<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function hasData(p,pn){return allTests(p,pn).some(t=>Object.keys((p.v||{})[t.key]||{}).length);}
function isOpen(p,pn){if(hasData(p,pn))return true;const k=pn.key;if(k in S.openPanels)return S.openPanels[k];return pn.core;}

function renderMain(){
  const m=$("#main");if(S.view==="chase")return renderChaseAll(m);const p=current();
  if(!p&&S.tab!=="active"){m.innerHTML=`<div class="welcome"><h2>No ${S.tab} patients</h2><p>${S.tab==="discharged"?"When you discharge a patient they move here with all their results, reports and images, ready if they're readmitted.":"Patients marked as deceased are kept here for reference."}</p></div>`;return;}
  if(!p){m.innerHTML=`<div class="welcome"><h2>No patients yet</h2><p>Add a patient to start trending their bloods.</p><button class="btn primary" type="button" data-act="add">+ Add patient</button></div>`;return;}
  const exMode=isEx(S.cur);const cols=sortedCols(p);
  const ag=p.age?String(p.age).replace(/\s*y$/i,"")+"y":age(p.dob);
  const meta=[[p.sex,ag].filter(Boolean).join(" "),p.ward,p.dx].filter(Boolean);
  let h="";
  const pst=stOf(p);
  if(pst==="discharged")h+=`<div class="sbanner dis"><span><b>Discharged</b>${p.dischargedAt?" "+esc(fmtDT(p.dischargedAt).d)+" "+esc(fmtDT(p.dischargedAt).t):""}. All results, reports and images are kept.</span><button class="btn primary small" type="button" data-st="readmit">Readmit</button></div>`;
  if(pst==="deceased")h+=`<div class="sbanner dec"><span><b>Deceased</b>${p.diedAt?" "+esc(fmtDT(p.diedAt).d)+" "+esc(fmtDT(p.diedAt).t):""}. Record kept for reference.</span></div>`;
  if(exMode)h+=`<div class="banner">These are three example patients so you can see how trending looks across different systems. Edits here aren't saved. Add your first patient to start; the examples then disappear.</div>`;
  h+=`<div class="phead"><div><h2>${esc(p.name||"Unnamed patient")}</h2><div class="meta">${meta.map(x=>`<span>${esc(x)}</span>`).join("")||"<span>Add details below</span>"}</div></div>
   <div class="toolbar"><button class="btn" type="button" data-act="paste">Paste results</button><button class="btn primary" type="button" data-act="entry">+ Enter results</button></div></div>`;
  h+=chaseHTML(p,S.cur,false);
  h+=todoHTML(p,S.cur);
  const openDetails=!p.name&&!exMode;
  h+=`<details class="card" id="detailsCard" ${openDetails?"open":""}><summary>${CHEV}Patient details</summary><div class="fields">
   ${fld("name","Label (e.g. initials or bed)",p.name)}${fld("age","Age (years)",p.age||(age(p.dob)||"").replace("y",""),"number")}
   <label class="field"><span>Sex (sets ranges)</span><select id="f_sex" data-f="sex"><option value="">Not set</option><option value="M" ${p.sex==="M"?"selected":""}>Male</option><option value="F" ${p.sex==="F"?"selected":""}>Female</option></select></label>
   ${fld("ward","Ward / bed",p.ward)}${fld("consultant","Consultant / team",p.consultant)}${fld("admitted","Admission date",p.admitted,"date")}${fld("dx","Working diagnosis",p.dx)}
   </div><p class="hint">No names, hospital numbers or dates of birth are stored. Use initials or bed number as the label.</p></details>`;
  h+=`<div class="sectlabel"><span>Results by system · D1 → latest, left to right</span><span><button class="linkbtn" type="button" data-act="showall" aria-pressed="${S.showAll}">${S.showAll?"Hide empty tests":"Show empty tests"}</button><button class="linkbtn" type="button" data-act="expand">Expand all</button><button class="linkbtn" type="button" data-act="collapse">Collapse all</button></span></div>`;
  const hiddenP=[];let shown=0;
  for(const pn of PANELS){const ph=panelHTML(p,pn,cols);if(ph){h+=ph;shown++;}else hiddenP.push(pn.name);}
  if(!shown)h+=`<div class="card" style="padding:16px"><p class="nodata">No results yet. Use <b>+ Enter results</b> after the next blood draw.</p></div>`;
  else if(hiddenP.length)h+=`<p class="nodata">No results yet: ${esc(hiddenP.join(" · "))}</p>`;
  h+=reportsHTML(p);
  h+=`<details class="card" open><summary>${CHEV}Notes <span class="sys" style="font-weight:400">${(p.notes||[]).length||""}</span></summary><div class="notes">${
    [...(p.notes||[])].sort((a,b)=>a.dt<b.dt?1:-1).map(n=>{const f=fmtDT(n.dt);return`<div class="note"><time>${esc(f.d)} ${esc(f.t)}</time><p>${esc(n.text)}</p><button class="rmrow" type="button" data-rmnote="${esc(n.id)}" aria-label="Delete note">✕</button></div>`;}).join("")||`<div class="empty" style="padding:4px 0 6px">No notes yet. Record trends, actions taken and who you informed.</div>`
  }</div><form class="noteform" id="noteForm"><textarea id="noteText" placeholder="e.g. K⁺ 5.9 → repeat sample, ECG done, SHO informed" aria-label="New note"></textarea><button class="btn" type="submit">Add note</button></form></details>`;
  h+=`<div class="foot"><span>Ranges are from your lab's reports. Ranges marked * are typical adult values, since your lab reports didn't include them.</span>${exMode?"":`<span class="stact">${pst==="active"?`<button class="btn small" type="button" data-st="discharge">Discharge</button><button class="btn small" type="button" data-st="deceased">Mark deceased</button>`:pst==="discharged"?`<button class="btn small" type="button" data-st="readmit">Readmit</button><button class="btn small" type="button" data-st="deceased">Mark deceased</button><button class="btn danger small" type="button" id="delPatient">Delete permanently</button>`:`<button class="btn small" type="button" data-st="reactivate">Move back to active</button><button class="btn danger small" type="button" id="delPatient">Delete permanently</button>`}</span>`}</div><div id="stconf"></div>`;
  m.innerHTML=h;
  m.querySelectorAll(".twrap").forEach(w=>{w.scrollLeft=w.scrollWidth;});}

function fld(k,label,val,type){return`<label class="field"><span>${esc(label)}</span><input id="f_${k}" data-f="${k}" type="${type||"text"}" value="${esc(val)}" autocomplete="off"></label>`;}

function rowHas(p,key){const r=(p.v||{})[key];return!!r&&Object.values(r).some(v=>v!=null&&String(v).trim()!=="");}
function panelHTML(p,pn,cols){
  const all=allTests(p,pn);const tests=S.showAll?all:all.filter(t=>rowHas(p,t.key));
  if(!tests.length)return"";
  const missing=S.showAll?[]:all.filter(t=>!tests.includes(t)).map(t=>t.n);
  const has=(k,c)=>{const v=((p.v||{})[k]||{})[c];return v!=null&&String(v).trim()!=="";};
  const pcols=S.showAll?cols:cols.filter(c=>all.some(t=>has(t.key,c.id)));
  const f=latestFlags(p,pn);
  const chips=(f.hi?`<span class="chip hi" title="High on latest">${f.hi} ↑</span>`:"")+(f.lo?`<span class="chip lo" title="Low on latest">${f.lo} ↓</span>`:"");
  let t=`<details class="card panel" data-panel="${pn.key}" ${isOpen(p,pn)?"open":""}><summary>${CHEV}${esc(pn.name)} <span class="sys">${esc(pn.sys)}</span><span class="flags">${chips}</span></summary>`;
  t+=`<div class="twrap"><table><thead><tr><th class="c-test">Test</th><th>Units</th><th>Range</th><th>Trend</th>`;
  pcols.forEach(c=>{const i=cols.indexOf(c);const d=fmtDT(c.dt);t+=`<th class="colh"><button type="button" class="d eb" data-editcol="${esc(c.id)}" title="Edit this sample">D${i+1} · ${esc(d.d)}</button><div>${esc(d.t)}</div><button class="x" type="button" data-rmcol="${esc(c.id)}" data-pn="${pn.key}" title="Remove ${esc(pn.name)} results for ${esc(d.d)} ${esc(d.t)}" aria-label="Remove ${esc(pn.name)} results for ${esc(d.d)} ${esc(d.t)}">✕</button></th>`;});
  if(!pcols.length)t+=`<th></th>`;
  t+=`</tr></thead><tbody>`;
  for(const ts of tests){const r=rangeFor(ts,p.sex);const row=(p.v||{})[ts.key]||{};
    t+=`<tr data-k="${esc(ts.key)}"><th class="c-test" scope="row">${esc(ts.n)}${ts.custom?`<button class="rmrow" type="button" data-rmtest="${esc(ts.key)}" data-pn="${pn.key}" aria-label="Remove ${esc(ts.n)}">✕</button>`:""}</th><td class="c-u">${esc(ts.u)}</td><td class="c-r">${esc(ts.custom?"—":rangeLabel(ts))}</td><td class="c-sp">${spark(p,ts)}</td>`;
    pcols.forEach(c=>{const val=row[c.id]??"";const fl=flag(val,r);const d=fmtDT(c.dt);
      t+=`<td class="v ${fl}"><input id="v_${esc(ts.key)}_${esc(c.id)}" data-k="${esc(ts.key)}" data-c="${esc(c.id)}" value="${esc(val)}" inputmode="decimal" autocomplete="off" aria-label="${esc(ts.n)} ${esc(d.d)} ${esc(d.t)}"></td>`;});
    if(!pcols.length)t+=`<td class="empty">Use + Enter results to add a sample</td>`;
    t+=`</tr>`;}

const normName=x=>String(x).toLowerCase().replace(/[⁺⁻₂₃²]/g,m=>({"₂":"2","₃":"3","²":"2"}[m]||"")).replace(/%/g,"pct").replace(/#/g,"abs").replace(/[^a-z0-9]/g,"");
const UNITISH=/^(h|l|hh|ll|mmoll|umoll|µmoll|kul|mul|gdl|gl|fl|pg|ul|iul|sec|s|ngml|pgml|mgl|dl|ml|ratio|low|high|intermediate|normal|abnormal|pend|range|ranges|units|test)$/;
function aliasMap(p){const m={};for(const k in ALIASES)for(const a of ALIASES[k])m[normName(a)]=k;
  for(const pn of PANELS)for(const t of allTests(p,pn)){if(t.custom)m[normName(t.n)]=t.key;else if(!m[normName(t.n)])m[normName(t.n)]=t.key;}
  return m;}
function parsePaste(text,p){
  let dt=null,rest=String(text||"").split(/\r?\n/).filter(l=>!/ranges?\s+in\s+effect|effective\s+from/i.test(l)).join("\n");
  let m=rest.match(/\b(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\b/);
  if(m){dt={y:+m[1],mo:+m[2],d:+m[3]};rest=rest.replace(m[0]," ");}
  else if((m=rest.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/))){const a=+m[1],b=+m[2];
    dt=a>12?{y:+m[3],mo:b,d:a}:{y:+m[3],mo:a,d:b};rest=rest.replace(m[0]," ");}
  let tm=rest.match(/\b(\d{1,2}):(\d{2})\b/);if(tm)rest=rest.replace(tm[0]," ");
  rest=rest.replace(/T4\s*,\s*FREE/ig,"FT4").replace(/>\/=|<\/=/g,"");
  const map=aliasMap(p);const vals={},unknown=[],dup=[];
  for(const seg of rest.split(/[,;\n\r\t|]+/)){
    const re=/([A-Za-z][A-Za-z0-9 ().'+\-⁺⁻₂₃%#]*?)\s*[:=]?\s+([<>≤≥]?\s*-?\d+(?:\.\d+)?)/g;let q;
    while((q=re.exec(seg+" "))){const name=q[1].trim();const key=map[normName(name)];const v=q[2].replace(/\s+/g,"");
      if(key){if(vals[key]!=null&&vals[key]!==v)dup.push(name);vals[key]=v;}else{const nn=normName(name);if(name.length<=24&&nn.length>1&&!/^[HL]\s/.test(name)&&!UNITISH.test(nn)&&!/(mmol|umol|iul|kul)$/.test(nn))unknown.push(name);}}}
  let dts=null;
  if(dt&&dt.mo>=1&&dt.mo<=12&&dt.d>=1&&dt.d<=31){const pad2=n=>String(n).padStart(2,"0");
    dts=dt.y+"-"+pad2(dt.mo)+"-"+pad2(dt.d)+"T"+(tm?pad2(+tm[1])+":"+tm[2]:"06:00");}
  return{vals,dt:dts,hasTime:!!tm,unknown:[...new Set(unknown)],dup:[...new Set(dup)]};}
function pasteSheet(){
  const p=current();if(!p)return;
  layer.innerHTML=`<div class="scrim" data-close></div><form class="sheet" id="psheet" novalidate>
    <header><h2>Paste results · ${esc(p.name||"patient")}</h2><button class="rmrow" type="button" data-close aria-label="Close" style="font-size:16px">✕</button></header>
    <div class="sbody"><label class="field" for="ptext"><span>Paste the results as copied from the lab</span></label>
      <textarea id="ptext" class="pastebox" spellcheck="false" placeholder="2026/09/18&#10;WBC 19.4, HGB 13.0, MCV 88.0, plts 232&#10;Na 133, K 4.3, Cl 93, CO2 25, BUN 4.5, Crt 71.6"></textarea>
      <p class="shint">Only recognised test names and their numbers are kept. Anything else in the paste, including names or hospital numbers, is ignored and never saved. You'll check every value before it's added.</p></div>
    <div class="sfoot"><span class="grow"></span><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Read results</button></div></form>`;
  layer.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeSheet));
  document.addEventListener("keydown",escSheet);
  const f=layer.querySelector("#psheet");const ta=f.querySelector("#ptext");setTimeout(()=>ta.focus(),0);
  f.addEventListener("submit",e=>{e.preventDefault();
    const blocks=splitByDate(ta.value);
    if(blocks.length>1){const byDt={},unk=new Set();
      for(const bl of blocks){const q=parsePaste(bl,p);q.unknown.forEach(u=>unk.add(u));if(!Object.keys(q.vals).length)continue;
        const key=q.dt||("nodate"+Object.keys(byDt).length);if(byDt[key])Object.assign(byDt[key].vals,q.vals);else byDt[key]=q;}
      const sets=Object.values(byDt);
      if(sets.length>1)return multiPasteSheet(p,sets,[...unk]);}
    const r=parsePaste(ta.value,p);const n=Object.keys(r.vals).length;
    if(!n){const h=f.querySelector(".shint");h.style.color="var(--hi)";h.textContent="No recognised results found. Check the paste has test names followed by numbers, e.g. \"Na 133, K 4.3\".";return;}
    const notes=[`<span><b>${n} results read.</b> Check each tab, then save.</span>`];
    if(!r.dt)notes.push(`<span>No date found in the paste. Set the sample time above.</span>`);
    else if(!r.hasTime)notes.push(`<span>No time in the paste, so 06:00 is used. Change it above if needed.</span>`);
    if(r.unknown.length)notes.push(`<span>Not recognised (ignored): ${esc(r.unknown.slice(0,12).join(", "))}</span>`);
    if(r.dup.length)notes.push(`<span>Appeared twice, last value kept: ${esc(r.dup.join(", "))}</span>`);
    entrySheet(null,{vals:r.vals,dt:r.dt,note:`<div class="readnote${(!r.dt||r.unknown.length)?" warn":""}">${notes.join("")}</div>`});});}

/* ---------- Paste with several dates ---------- */
function splitByDate(text){
  const clean=String(text||"").split(/\r?\n/).filter(l=>!/ranges?\s+in\s+effect|effective\s+from/i.test(l)).join("\n");
  const re=/\b\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}\b|\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{4}\b/g;const idx=[];let m;
  while((m=re.exec(clean)))idx.push(m.index);
  if(idx.length<2)return[clean];
  const out=[];for(let k=0;k<idx.length;k++)out.push(clean.slice(k===0?0:idx[k],k+1<idx.length?idx[k+1]:clean.length));
  return out;}
function findTest(p,key){for(const pn of PANELS){const t=allTests(p,pn).find(x=>x.key===key);if(t)return t;}return null;}
function multiPasteSheet(p,sets,unknown){
  sets.sort((a,b)=>(a.dt||"")<(b.dt||"")?-1:1);
  const colAt=dt=>(p.cols||[]).find(c=>c.dt===dt);

async function shrinkImage(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const max=2560;const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const out=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9));return out||file;}catch(e){return file;}}

  const sel=(k,l,opts,v)=>`<label class="field"><span>${l}</span><select id="r_${k}" data-rf="${k}">${(opts.includes(v)||!v?opts:[v,...opts]).map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  const dls=`<datalist id="dl_spec">${DL.spec.map(x=>`<option value="${esc(x)}">`).join("")}</datalist><datalist id="dl_mtest">${DL.mtest.map(x=>`<option value="${esc(x)}">`).join("")}</datalist><datalist id="dl_abx">${DL.abx.map(x=>`<option value="${esc(x)}">`).join("")}</datalist><datalist id="dl_proc">${DL.proc.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`;

  if(type==="path")body+=`<div class="fields2">${fi("specimen","Specimen / site",e.specimen,' placeholder="e.g. Sigmoid colon biopsy"')}${fi("procedure","Procedure",e.procedure,' list="dl_proc"')}</div>

  if(type==="rad")body+=`<div class="fields2">${sel("modality","Modality",DL.mod,e.modality||"X-ray")}${fi("study","Study / region",e.study,' placeholder="e.g. CXR PA, CT abdomen/pelvis + contrast"')}</div>
    ${ta("impression","Impression",e.impression,2,"e.g. Right lower lobe consolidation. No effusion.")}

  body+=`<div class="field"><span>Images and files</span>
    ${canUp?`<label class="chk"><input type="checkbox" id="idok"> I've cropped or covered names, hospital numbers and dates of birth in these files</label>
      <label class="btn small upl" id="uplLbl" aria-disabled="true">Upload images or PDF<input type="file" id="ufile" accept="${ACCEPT.join(",")}" multiple disabled></label>

    <div id="flist"></div><p class="shint ferr" id="ferr" hidden></p></div>`;
  const d=cur?fmtDT(cur.dt):null;
  layer.innerHTML=`<div class="scrim" data-close></div><form class="sheet" id="rsheet" novalidate>
    <header><h2>${cur?"Edit":"Add"} ${esc(REP[type].title.split(" &")[0].toLowerCase())} · ${esc(p.name||"patient")}</h2><button class="rmrow" type="button" data-close aria-label="Close" style="font-size:16px">✕</button></header>

  const f=layer.querySelector("#rsheet");

  const drawFiles=()=>{f.querySelector("#flist").innerHTML=filesHTML(e.files,true);};drawFiles();
  f.querySelector("#flist").addEventListener("click",ev=>{
    const rm=ev.target.closest("[data-frm]");if(rm){const i=+rm.dataset.frm;const x=e.files[i];e.files.splice(i,1);

  if(canUp){const ok=f.querySelector("#idok"),inp=f.querySelector("#ufile"),lbl=f.querySelector("#uplLbl");
    ok.addEventListener("change",()=>{inp.disabled=!ok.checked;lbl.setAttribute("aria-disabled",String(!ok.checked));});
    inp.addEventListener("change",async()=>{showErr("");const list=[...inp.files];inp.value="";

        const tmp={id:null,name:file.name,type:file.type==="application/pdf"?"application/pdf":"image/jpeg",busy:true};e.files.push(tmp);busy++;drawFiles();
        try{const blob=file.type==="application/pdf"?file:await shrinkImage(file);

        catch(err){e.files.splice(e.files.indexOf(tmp),1);const c=err&&err.code;
          showErr(file.name+": "+(c==="too_large"?"file is over 20 MB.":c==="unsupported_type"?"this file type can't be stored.":c==="quota_or_state"?"storage is full. Remove old files first.":c==="rate_limited"?"too many uploads at once. Wait a moment and try again.":"upload failed. Try again."));}

    f.querySelector("#sensAdd").addEventListener("click",()=>{e.sens.push({abx:"",r:""});drawSens();const all=sensBox.querySelectorAll("input");all[all.length-1].focus();});

const CCATS=["Bloods","Culture / micro","Biopsy / pathology","Imaging","Referral / review","Procedure","Other"];
function patientById(id){return isEx(id)?(S.examples||{})[id]:S.patients[id];}
function autoChase(p){const out=[];
  for(const type of ["micro","path","rad"])for(const e of (p[type]||[]))if(!/final|reported/i.test(e.status||"")){
    const what=type==="rad"?((e.modality?e.modality+" · ":"")+(e.study||"Imaging")):((e.specimen||"Specimen")+(e.test?" · "+e.test:""));
    out.push({auto:true,type,id:e.id,cat:type==="micro"?"Culture / micro":type==="path"?"Biopsy / pathology":"Imaging",text:what,status:e.status||"Pending",dt:e.dt});}
  return out;}

function dueOf(c){if(!c.due)return null;const d=new Date(c.due);if(isNaN(d))return null;const n=new Date();
  const same=d.toDateString()===n.toDateString();const f=fmtDT(c.due);

function chaseItems(p,pid){
  const open=(p.chase||[]).filter(c=>!c.done).sort((a,b)=>{const da=a.due||"9999",db=b.due||"9999";return da<db?-1:da>db?1:(a.created<b.created?-1:1);});
  let h=open.map(c=>{const d=dueOf(c);return`<li class="citem${d&&d.over?" over":""}"><button class="cbox" type="button" data-cdone="${esc(pid)}|${esc(c.id)}" aria-label="Mark done: ${esc(c.text)}"></button><span class="ccat">${esc(c.cat||"Other")}</span><span class="ctext">${esc(c.text)}</span>${d?`<span class="cdue${d.today?" today":""}">${esc(d.label.trim())}</span>`:`<span class="cdue"></span>`}<button class="rmrow" type="button" data-cdel="${esc(pid)}|${esc(c.id)}" aria-label="Delete">✕</button></li>`;}).join("");
  h+=autoChase(p).map(a=>{const f=fmtDT(a.dt);return`<li class="citem auto"><span class="cbox dash" aria-hidden="true"></span><span class="ccat">${esc(a.cat)}</span><span class="ctext">${esc(a.text)}<em>${esc(a.status.toLowerCase())} · sent ${esc(f.d)}</em></span><span class="cdue"></span><button class="linkbtn" type="button" data-cgo="${esc(pid)}|${a.type}|${esc(a.id)}">Add result</button></li>`;}).join("");
  return h;}
function chaseHTML(p,pid,compact){
  const open=(p.chase||[]).filter(c=>!c.done);const auto=autoChase(p);const n=open.length+auto.length;
  const over=open.filter(c=>{const d=dueOf(c);return d&&d.over;}).length;
  const done=(p.chase||[]).filter(c=>c.done).sort((a,b)=>(a.doneAt||"")<(b.doneAt||"")?1:-1);
  let h=`<section class="chase" aria-label="To chase"><div class="chead"><h3>To chase</h3><span class="ccount">${n} open</span>${over?`<span class="cover">${over} overdue</span>`:""}</div>`;
  h+=n?`<ul class="clist">${chaseItems(p,pid)}</ul>`:`<p class="cnone">Nothing to chase. Add results, reports or reviews you're waiting on.</p>`;
  h+=`<form class="cadd" id="chaseForm" data-pid="${esc(pid)}"><select id="c_cat" aria-label="Type">${CCATS.map(c=>`<option>${esc(c)}</option>`).join("")}</select><input id="c_text" autocomplete="off" placeholder="What to chase, e.g. blood culture final result, CT report, histology" aria-label="What to chase"><input id="c_due" type="datetime-local" aria-label="Due by (optional)" title="Due by (optional)"><button class="btn primary small" type="submit">Add</button></form>`;
  if(done.length)h+=`<details class="cdone"><summary>Done (${done.length})</summary><ul class="clist">${done.map(c=>{const f=c.doneAt?fmtDT(c.doneAt):null;return`<li class="citem done"><button class="cbox on" type="button" data-cundo="${esc(pid)}|${esc(c.id)}" aria-label="Mark not done">✓</button><span class="ccat">${esc(c.cat||"Other")}</span><span class="ctext">${esc(c.text)}</span><span class="cdue">${f?"done "+esc(f.d):""}</span><button class="rmrow" type="button" data-cdel="${esc(pid)}|${esc(c.id)}" aria-label="Delete">✕</button></li>`;}).join("")}</ul><button class="linkbtn" type="button" data-cclear="${esc(pid)}">Clear done</button></details>`;
  return h+`</section>`;}
function renderChaseAll(m){
  const list=ordered().length?ordered().filter(x=>stOf(x[1])!=="deceased"):Object.entries(S.examples||{});
  let total=0,over=0;let g="";
  for(const [id,p] of list){const n=chaseCount(p);if(!n)continue;total+=n;
    over+=(p.chase||[]).filter(c=>!c.done&&dueOf(c)&&dueOf(c).over).length;
    g+=`<div class="cgroup"><h4><button type="button" data-open="${esc(id)}">${esc(p.name||"Unnamed patient")}</button>${stOf(p)==="discharged"?` <span class="stp pend">discharged</span>`:""}${p.ward?` <span class="ccount" style="font-weight:400;font-family:var(--mono);font-size:12px;color:var(--muted)">${esc(p.ward)}</span>`:""}</h4><ul class="clist">${chaseItems(p,id)}</ul></div>`;}
  m.innerHTML=`${ordered().length?"":`<div class="banner">Showing the example patients' chase items.</div>`}<section class="chase"><div class="chead"><h3>Ward chase list</h3><span class="ccount">${total} open across ${list.filter(([i,p])=>chaseCount(p)).length} patients</span>${over?`<span class="cover">${over} overdue</span>`:""}</div>${g||`<p class="cnone">Nothing to chase on the ward.</p>`}<p class="cnone" style="font-size:12.5px">Tick items here or on each patient. Pending cultures, pathology and imaging appear automatically until marked Final or Reported.</p></section>`+wardTodoHTML(ordered().length?ordered():Object.entries(S.examples||{}));}
function chaseAct(ev){
  const t=ev.target.closest("[data-cdone],[data-cundo],[data-cdel],[data-cclear],[data-cgo],[data-open]");if(!t)return;
  if(t.dataset.open){S.cur=t.dataset.open;S.view="patient";const op=patientById(S.cur);S.tab=isEx(S.cur)?"active":stOf(op);renderAll();window.scrollTo(0,0);return;}
  const [pid,a,b]=(t.dataset.cdone||t.dataset.cundo||t.dataset.cdel||t.dataset.cclear||t.dataset.cgo).split("|");const p=patientById(pid);if(!p)return;
  if(t.dataset.cgo){S.cur=pid;S.view="patient";S.tab=isEx(pid)?"active":stOf(p);renderAll();return repSheet(a,b);}
  if(t.dataset.cclear){p.chase=(p.chase||[]).filter(c=>!c.done);}
  else{const c=(p.chase||[]).find(x=>x.id===a);if(!c)return;
    if(t.dataset.cdone){c.done=true;c.doneAt=nowLocal();}
    else if(t.dataset.cundo){c.done=false;delete c.doneAt;}
    else if(t.dataset.cdel){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Delete?";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="✕";}},3000);return;}
      p.chase=p.chase.filter(x=>x.id!==a);}}
  touch(pid);renderAll();}
main.addEventListener("click",chaseAct);

/* ---------- Supabase mode (GitHub + Supabase deployment) ----------
   Used only when config.js provides SUPABASE_URL and SUPABASE_ANON_KEY.
   Each patient is one JSON document; edits are sent as small patches so
   two people editing the same patient don't overwrite each other. */
const CFG=Object.assign({SUPABASE_URL:"",SUPABASE_ANON_KEY:"",IDLE_MINUTES:15,BUCKET:"ward-files"},window.WB_CONFIG||{});
const SB={client:null,team:null,teamName:"",snap:{},urls:{},wantUrl:new Set(),urlT:null,pullT:{},pullAfter:{}};
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
const isObj=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
const keyOf=e=>isObj(e)?(e.id!=null?String(e.id):e.k!=null?String(e.k):null):null;
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function diffDoc(a,b,path,ops){path=path||[];ops=ops||[];
  if(isObj(a)&&isObj(b)){
    for(const k of Object.keys(b)){if(!(k in a))ops.push({op:"set",path:[...path,k],value:b[k]});else diffDoc(a[k],b[k],[...path,k],ops);}
    for(const k of Object.keys(a))if(!(k in b))ops.push({op:"del",path:[...path,k]});
    return ops;}
  const idArr=x=>Array.isArray(x)&&x.every(e=>keyOf(e)!=null);
  if(idArr(a)&&idArr(b)&&!same(a,b)){
    const am=new Map(a.map(e=>[keyOf(e),e])),bm=new Map(b.map(e=>[keyOf(e),e]));
    for(const [k,e] of bm)if(!am.has(k)||!same(am.get(k),e))ops.push({op:"upsert",path,item:e});
    for(const k of am.keys())if(!bm.has(k))ops.push({op:"remove",path,id:k});
    return ops;}
  if(!same(a,b))ops.push({op:"set",path,value:b===undefined?null:b});
  return ops;}
function setDeep(t,p,v){if(!p.length)return v;const o=isObj(t)?t:{};o[p[0]]=setDeep(o[p[0]],p.slice(1),v);return o;}
function getDeep(t,p){return p.reduce((x,k)=>x==null?undefined:x[k],t);}
function applyOps(doc,ops){let d=clone(doc)||{};
  for(const o of ops){
    if(o.op==="set")d=setDeep(d,o.path,clone(o.value));
    else if(o.op==="del"){const par=getDeep(d,o.path.slice(0,-1));if(isObj(par))delete par[o.path[o.path.length-1]];}
    else{let arr=getDeep(d,o.path);arr=Array.isArray(arr)?arr:[];const id=o.op==="upsert"?keyOf(o.item):String(o.id);
      arr=arr.filter(e=>keyOf(e)!==id);if(o.op==="upsert")arr.push(clone(o.item));d=setDeep(d,o.path,arr);}}
  return d;}
function replaceInPlace(obj,src){for(const k of Object.keys(obj))delete obj[k];Object.assign(obj,clone(src));}
function afterSync(id,before){renderSidebar();refreshStatus();
  if(id===S.cur&&before!==JSON.stringify(S.patients[id])&&!main.contains(document.activeElement)&&!document.querySelector(".sheet"))renderMain();}

async function sbFlush(id){
  if(S.writing[id]){S.again[id]=true;return;}
  const p=S.patients[id];if(!p){S.dirty.delete(id);refreshStatus();return;}
  S.writing[id]=true;const sent=clone(p);const before=JSON.stringify(p);let server;
  try{
    if(!SB.snap[id]){
      const {data,error}=await SB.client.from("patients").insert({id,team_id:SB.team,doc:sent}).select("doc").single();
      if(error)throw error;server=data.doc;}
    else{const ops=diffDoc(SB.snap[id],sent);
      if(ops.length){const {data,error}=await SB.client.rpc("patch_patient",{p_id:id,p_ops:ops});if(error)throw error;server=data;}
      else server=SB.snap[id];}}
  catch(e){console.warn(e);S.writing[id]=false;setStatus("local","Couldn't save ("+(e&&e.message||"connection")+"). Retrying…");
    setTimeout(()=>flush(id),5000);return;}
  const extra=diffDoc(sent,clone(p));
  SB.snap[id]=clone(server);replaceInPlace(p,extra.length?applyOps(server,extra):server);
  S.writing[id]=false;
  if(S.again[id]||extra.length){S.again[id]=false;return sbFlush(id);}
  S.dirty.delete(id);
  if(SB.pullAfter[id]){SB.pullAfter[id]=false;queuePull(id);}
  afterSync(id,before);}

function queuePull(id){clearTimeout(SB.pullT[id]);SB.pullT[id]=setTimeout(()=>sbPull(id),250);}
async function sbPull(id){
  if(S.writing[id]){SB.pullAfter[id]=true;return;}
  const {data,error}=await SB.client.from("patients").select("id,doc,discharged_at").eq("id",id).maybeSingle();
  if(error){console.warn(error);return;}
  const p=S.patients[id];const before=p?JSON.stringify(p):null;
  if(!data||data.discharged_at){if(p&&!S.dirty.has(id)){delete S.patients[id];delete SB.snap[id];
      if(S.cur===id){const l=ordered();if(l.length)S.cur=l[0][0];else showExamples();renderAll();return;}}
    renderSidebar();return;}
  if(!p){S.patients[id]=clone(data.doc);SB.snap[id]=clone(data.doc);
    if(isEx(S.cur)){S.examples=null;S.cur=id;renderAll();return;}renderSidebar();return;}
  const pending=S.dirty.has(id)?diffDoc(SB.snap[id]||{},clone(p)):[];
  SB.snap[id]=clone(data.doc);replaceInPlace(p,pending.length?applyOps(data.doc,pending):data.doc);
  afterSync(id,before);}

async function sbDelete(id,p){
  const files=[];
  for(const t of ["micro","path","rad"])for(const e of ((p&&p[t])||[]))for(const f of (e.files||[]))if(f.id)files.push(f.id);
  if(files.length){try{await SB.client.storage.from(CFG.BUCKET).remove(files);}catch(e){console.warn(e);}}
  const {error}=await SB.client.from("patients").delete().eq("id",id);
  if(error){console.warn(error);setStatus("local","Couldn't delete: "+error.message);}
  delete SB.snap[id];}

const MIME_EXT={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","application/pdf":"pdf"};
const sbAssets={
  async upload(blob,opts){const type=(opts&&opts.type)||blob.type;const pid=S.cur;
    const path=SB.team+"/"+pid+"/"+uid()+"."+(MIME_EXT[type]||"bin");
    const {error}=await SB.client.storage.from(CFG.BUCKET).upload(path,blob,{contentType:type,upsert:false,cacheControl:"3600"});
    if(error)throw{code:/size|large|exceed/i.test(error.message)?"too_large":/mime|type/i.test(error.message)?"unsupported_type":"upstream_error",message:error.message};
    return{id:path,url:"",sizeBytes:blob.size,contentType:type};},
  async delete(id){try{await SB.client.storage.from(CFG.BUCKET).remove([id]);}catch(e){}return{deleted:true};}};
function fileSrc(id){
  if(S.mode!=="supabase")return"/_blob/"+id;
  const u=SB.urls[id];if(u&&u.exp>Date.now())return u.url;
  SB.wantUrl.add(id);clearTimeout(SB.urlT);SB.urlT=setTimeout(fetchUrls,20);return"";}
async function fetchUrls(){const ids=[...SB.wantUrl];SB.wantUrl.clear();if(!ids.length||!SB.client)return;
  const {data,error}=await SB.client.storage.from(CFG.BUCKET).createSignedUrls(ids,3600);if(error){console.warn(error);return;}
  for(const r of (data||[])){if(!r.signedUrl)continue;SB.urls[r.path]={url:r.signedUrl,exp:Date.now()+3300e3};
    document.querySelectorAll('[data-fsrc="'+CSS.escape(r.path)+'"]').forEach(el=>{if(el.tagName==="A")el.href=r.signedUrl;else el.src=r.signedUrl;});}}

function loadScript(src,integrity){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;if(integrity){s.integrity=integrity;s.crossOrigin="anonymous";}s.onload=res;s.onerror=()=>rej(new Error("Couldn't load the Supabase library. Check your connection."));document.head.appendChild(s);});}
const GATE_CSS=`.wbg{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.wbg form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}

.wbg input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px}

.wbg code{font-size:12px;word-break:break-all;background:var(--bg);padding:6px 8px;border-radius:6px}`;
function gate(html,onSubmit){
  let g=document.getElementById("wbgate");
  if(!g){const st=document.createElement("style");st.textContent=GATE_CSS;document.head.appendChild(st);g=document.createElement("div");g.id="wbgate";g.className="wbg";document.body.appendChild(g);}
  g.hidden=false;g.innerHTML=`<form novalidate>${html}<div class="err" role="alert"></div></form>`;
  const f=g.querySelector("form"),er=f.querySelector(".err");
  f.addEventListener("submit",async ev=>{ev.preventDefault();er.textContent="";const b=f.querySelector("button[type=submit]");if(b)b.disabled=true;
    try{await onSubmit(f);}catch(x){er.textContent=x&&x.message?x.message:String(x);}finally{if(b)b.disabled=false;}});
  f.querySelectorAll("[data-signout]").forEach(b=>b.addEventListener("click",()=>sbSignOut()));
  const pin=f.querySelector("#wb_pin");if(pin)pin.addEventListener("input",()=>{pin.value=pin.value.replace(/\D/g,"").slice(0,6);if(pin.value.length===6)f.requestSubmit();});
  const first=f.querySelector("input");if(first)first.focus();}
function hideGate(){const g=document.getElementById("wbgate");if(g)g.hidden=true;}
async function authFlow(){
  const sb=SB.client;
  const {data:{session}}=await sb.auth.getSession();
  if(!session){const {error}=await sb.auth.signInAnonymously();
    if(error){const m=String(error.message||"");
      if(/anonymous/i.test(m))throw new Error("PIN sign-in is turned off in Supabase. Go to Authentication → Sign In / Providers and turn on “Allow anonymous sign-ins”. (Supabase said: "+m+")");
      if(/api ?key/i.test(m))throw new Error("Supabase didn't accept the key in config.js. Copy the anon public key again from Project Settings → API. (Supabase said: "+m+")");
      if(/fetch|network/i.test(m))throw new Error("Couldn't reach Supabase. Check SUPABASE_URL in config.js and your connection. (Error: "+m+")");
      throw new Error("Couldn't connect. Supabase said: "+m);}}
  return new Promise(res=>gate(`<h2>Ward Bloods</h2><p>Enter the team PIN.</p>
    <label>PIN<input id="wb_pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6" required style="letter-spacing:.5em;font-size:24px;text-align:center"></label>
    <button type="submit">Unlock</button>`,async f=>{
      const v=f.wb_pin.value.trim();
      const {data,error}=await sb.rpc("join_with_pin",{p_pin:v});
      if(error)throw new Error(/function|schema cache|does not exist/i.test(error.message)?"The database isn't set up for PIN sign-in yet. Run the new schema.sql in Supabase.":"Couldn't check the PIN: "+error.message);
      if(!data||!data.ok){f.wb_pin.value="";f.wb_pin.focus();throw new Error((data&&data.error)||"Wrong PIN.");}
      res({team_id:data.team_id,team_name:data.team_name});}));}
async function sbSignOut(){document.body.innerHTML="";location.reload();}
function checkConfig(){
  const url=String(CFG.SUPABASE_URL||"").trim(),key=String(CFG.SUPABASE_ANON_KEY||"").trim();
  const m=url.match(/^https:\/\/([a-z0-9]{10,40})\.supabase\.co\/?$/);
  if(!m)return"SUPABASE_URL doesn't look right: \""+esc(url)+"\". It should look like https://abcdefghijkl.supabase.co with nothing after .co.";
  if(/\s/.test(key))return"The key in config.js contains a space or line break. Paste it again as one unbroken line.";
  if(key.startsWith("sb_secret_"))return"That's the SECRET key. Never put it in config.js. Use the anon public (or publishable) key, then rotate the secret key in Supabase because it has been exposed.";
  if(key.startsWith("sb_publishable_"))return"";
  const parts=key.split(".");
  if(parts.length!==3||!key.startsWith("eyJ"))return"The key doesn't look complete. It starts \""+esc(key.slice(0,8))+"…\" and is "+key.length+" characters long. The anon key starts with eyJ, has two dots and is about 200+ characters. Use the copy button next to it.";
  let pl=null;try{pl=JSON.parse(atob(parts[1].replace(/-/g,"+").replace(/_/g,"/")+"===".slice((parts[1].length+3)%4)));}catch(e){return"The key is cut off or has extra characters. Copy it again with the copy button.";}
  if(pl.role==="service_role")return"That's the service_role (secret) key. Never put it in config.js. Use the anon public key, and rotate the service key in Supabase because it has been exposed.";
  if(pl.ref&&pl.ref!==m[1])return"The key and the URL are from different projects. The URL is for \""+esc(m[1])+"\" but the key is for \""+esc(pl.ref)+"\". Copy both from the same project's Settings → API page.";
  return"";}
async function bootSupabase(){
  S.mode="supabase";setStatus("busy","Connecting…");
  const bad=checkConfig();
  if(bad){gate(`<h2>Check config.js</h2><p>${bad}</p><button type="submit">Try again</button>`,async()=>location.reload());return;}
  try{
    if(!(window.supabase&&window.supabase.createClient))await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js","sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz");
    SB.client=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,storage:window.localStorage}});
    const tm=await authFlow();
    SB.team=tm.team_id;SB.teamName=tm.team_name||"team";hideGate();
    const {data:rows,error:pe}=await SB.client.from("patients").select("id,doc").is("discharged_at",null);if(pe)throw pe;
    for(const r of rows){S.patients[r.id]=clone(r.doc);SB.snap[r.id]=clone(r.doc);}
    SB.client.channel("wb-"+SB.team).on("postgres_changes",{event:"*",schema:"public",table:"patients"},pl=>{const id=(pl.new&&pl.new.id)||(pl.old&&pl.old.id);if(id)queuePull(id);}).subscribe();
    S.assets=sbAssets;
    const so=document.getElementById("signOut");if(so){so.hidden=false;so.addEventListener("click",sbSignOut);}
    const mins=Number(CFG.IDLE_MINUTES)||15;let it=null;const reset=()=>{clearTimeout(it);it=setTimeout(sbSignOut,mins*60000);};
    ["pointerdown","keydown","touchstart","scroll"].forEach(ev=>window.addEventListener(ev,reset,{passive:true}));reset();
    afterLoad();}
  catch(e){console.error(e);gate(`<h2>Can't connect</h2><p>${esc(e&&e.message||e)}</p><button type="submit">Try again</button>`,async()=>location.reload());}}

/* ---------- Discharge / deceased / readmit ---------- */
function openItems(p){const o=(p.chase||[]).filter(c=>!c.done).map(c=>c.text);autoChase(p).forEach(a=>o.push(a.text+" ("+a.status.toLowerCase()+")"));return o;}
main.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-st],[data-stgo],[data-stno]");if(!t)return;const p=current();if(!p||isEx(S.cur))return;
  const box=document.getElementById("stconf");
  if(t.dataset.stno!=null){if(box)box.innerHTML="";return;}
  const act=t.dataset.st||t.dataset.stgo;
  if(t.dataset.st&&(act==="discharge"||act==="deceased")){
    const open=openItems(p);
    box.innerHTML=`<div class="stconf ${act}"><h4>${act==="discharge"?"Discharge "+esc(p.name||"patient"):"Mark "+esc(p.name||"patient")+" as deceased"}</h4>
      <label class="field"><span>${act==="discharge"?"Discharged":"Date and time of death"}</span><input type="datetime-local" id="st_dt" value="${nowLocal()}"></label>
      ${act==="discharge"&&open.length?`<div class="stwarn"><b>${open.length} still open.</b> Hand these over, or keep chasing them from the Discharged tab (they stay on the ward chase list):<ul>${open.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
      <p class="shint">${act==="discharge"?"The patient moves to the Discharged tab with all results, reports and images. Use Readmit if they come back.":"The patient moves to the Deceased tab. Nothing is deleted."}</p>
      <div class="stbtns"><button class="btn" type="button" data-stno>Cancel</button><button class="btn primary" type="button" data-stgo="${act}">${act==="discharge"?"Discharge":"Mark deceased"}</button></div></div>`;
    box.scrollIntoView({block:"nearest",behavior:"smooth"});return;}
  const dtIn=document.getElementById("st_dt");const when=(dtIn&&dtIn.value)||nowLocal();
  if(act==="discharge"){p.status="discharged";p.dischargedAt=when;}
  else if(act==="deceased"){p.status="deceased";p.diedAt=when;delete p.dischargedAt;}
  else if(act==="readmit"){p.readmissions=(p.readmissions||[]).concat([{discharged:p.dischargedAt||"",readmitted:nowLocal()}]);
    p.status="active";delete p.dischargedAt;p.admitted=nowLocal().slice(0,10);
    p.notes=p.notes||[];p.notes.push({id:uid().slice(0,12),dt:nowLocal(),text:"Readmitted. Previous results kept above."});}
  else if(act==="reactivate"){p.status="active";delete p.diedAt;}
  else return;
  S.tab=stOf(p);touch(S.cur);renderAll();window.scrollTo(0,0);});

/* ---------- Today's jobs (daily to-do per patient) ---------- */
const JOBS=["Bloods","Review bloods","Chase results","Chart / review meds","Fluids","Cannula","Catheter review","ECG","CXR","Referral","Consent","Discharge summary","TTO / discharge meds","Call family","Senior review","Update relatives","OT / PT review","Swab / culture"];
const todayStr=()=>nowLocal().slice(0,10);
function dayLabel(d){const t=todayStr();if(d===t)return"today";const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+"-"+pad(y.getMonth()+1)+"-"+pad(y.getDate());if(d===ys)return"yesterday";return fmtDT(d+"T00:00").d;}
function todoCounts(p){const t=todayStr();const all=p.todo||[];const today=all.filter(x=>x.day===t);
  return{open:today.filter(x=>!x.done).length+all.filter(x=>x.day<t&&!x.done).length,done:today.filter(x=>x.done).length,total:today.length};}
function todoItem(pid,x,carried){
  return`<li class="titem${x.done?" done":""}${carried?" carried":""}"><button class="tbox${x.done?" on":""}" type="button" data-tdone="${esc(pid)}|${esc(x.id)}" aria-pressed="${!!x.done}" aria-label="${x.done?"Mark not done":"Mark done"}: ${esc(x.text)}">${x.done?"✓":""}</button><span class="ttext">${esc(x.text)}${carried?`<em>from ${esc(dayLabel(x.day))}</em>`:""}</span>${carried?`<button class="linkbtn" type="button" data-tmove="${esc(pid)}|${esc(x.id)}">Move to today</button>`:x.done&&x.doneAt?`<span class="tdone">${esc(fmtDT(x.doneAt).t)}</span>`:"<span></span>"}<button class="rmrow" type="button" data-tdel="${esc(pid)}|${esc(x.id)}" aria-label="Delete">✕</button></li>`;}
function todoHTML(p,pid){
  const t=todayStr();const all=p.todo||[];
  const today=all.filter(x=>x.day===t).sort((a,b)=>(a.done-b.done)||((a.created||"")<(b.created||"")?-1:1));
  const carried=all.filter(x=>x.day<t&&!x.done).sort((a,b)=>a.day<b.day?-1:1);
  const done=today.filter(x=>x.done).length;
  let h=`<section class="todo" aria-label="Today's jobs"><div class="thead"><h3>Today's jobs</h3><span class="tcount">${today.length?done+" of "+today.length+" done":"nothing yet"}</span>${today.length&&done===today.length?`<span class="tall">All done</span>`:""}</div>`;
  if(today.length)h+=`<ul class="tlist">${today.map(x=>todoItem(pid,x,false)).join("")}</ul>`;
  if(carried.length)h+=`<div class="tcarry"><p>Not done from earlier (${carried.length})</p><ul class="tlist">${carried.map(x=>todoItem(pid,x,true)).join("")}</ul></div>`;
  h+=`<form class="tadd" id="todoForm" data-pid="${esc(pid)}"><input id="t_text" list="dl_jobs" autocomplete="off" placeholder="Add a job for today, e.g. repeat U&amp;E, discharge summary" aria-label="New job"><button class="btn primary small" type="submit">Add</button></form><datalist id="dl_jobs">${JOBS.map(j=>`<option value="${esc(j)}">`).join("")}</datalist>`;
  const past=all.filter(x=>x.day<t);
  if(past.length){const days=[...new Set(past.map(x=>x.day))].sort().reverse();
    h+=`<details class="thist"><summary>Previous days (${days.length})</summary>${days.map(d=>{const its=past.filter(x=>x.day===d).sort((a,b)=>(b.done-a.done));const nd=its.filter(x=>x.done).length;
      return`<div class="tday"><h5>${esc(dayLabel(d)==="yesterday"?"Yesterday · "+fmtDT(d+"T00:00").d:fmtDT(d+"T00:00").d)} <span>${nd} of ${its.length} done</span></h5><ul>${its.map(x=>`<li class="${x.done?"ok":"no"}"><span class="mk">${x.done?"✓":"○"}</span><span>${esc(x.text)}</span><span class="tm">${x.done&&x.doneAt?esc(fmtDT(x.doneAt).t):"not done"}</span></li>`).join("")}</ul></div>`;}).join("")}</details>`;}
  return h+`</section>`;}
function wardTodoHTML(list){
  const t=todayStr();let g="",open=0;
  for(const [id,p] of list){if(stOf(p)!=="active")continue;const all=p.todo||[];
    const items=all.filter(x=>(x.day===t)||(x.day<t&&!x.done));if(!items.length)continue;
    open+=items.filter(x=>!x.done).length;
    g+=`<div class="cgroup"><h4><button type="button" data-open="${esc(id)}">${esc(p.name||"Unnamed patient")}</button>${p.ward?` <span style="font-weight:400;font-family:var(--mono);font-size:12px;color:var(--muted)">${esc(p.ward)}</span>`:""}</h4><ul class="tlist">${items.sort((a,b)=>(a.done-b.done)).map(x=>todoItem(id,x,x.day<t)).join("")}</ul></div>`;}
  return`<section class="todo"><div class="thead"><h3>Today's jobs · ward</h3><span class="tcount">${open} still to do</span></div>${g||`<p class="tnone">No jobs added for today yet.</p>`}</section>`;}
main.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-tdone],[data-tdel],[data-tmove]");if(!t)return;
  const [pid,id]=(t.dataset.tdone||t.dataset.tdel||t.dataset.tmove).split("|");const p=patientById(pid);if(!p)return;
  const x=(p.todo||[]).find(y=>y.id===id);if(!x)return;
  if(t.dataset.tdone){x.done=!x.done;if(x.done)x.doneAt=nowLocal();else delete x.doneAt;}
  else if(t.dataset.tmove){x.day=todayStr();}
  else{if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Delete?";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="✕";}},3000);return;}
    p.todo=p.todo.filter(y=>y.id!==id);}
  touch(pid);renderAll();});
main.addEventListener("submit",ev=>{const f=ev.target;if(f.id!=="todoForm")return;ev.preventDefault();
  const pid=f.dataset.pid;const p=patientById(pid);if(!p)return;const inp=f.querySelector("#t_text");const txt=inp.value.trim();if(!txt){inp.focus();return;}
  p.todo=p.todo||[];p.todo.push({id:uid().slice(0,12),day:todayStr(),text:txt.slice(0,200),done:false,created:nowLocal()});
  touch(pid);renderAll();setTimeout(()=>{const i=document.getElementById("t_text");if(i)i.focus();},0);});

/* ---------- Boot ---------- */
function useLocal(){
  const saved=lsGet(LS_KEY);let ok=lsSet("wardbloods.probe",1);
  S.mode=ok?"local":"memory";S.patients=saved&&typeof saved==="object"?saved:{};
  afterLoad();}
function afterLoad(){
  S.loaded=true;
  for(const [id,p] of Object.entries(S.patients)){if(p&&(p.mrn||p.dob)){if(!p.age&&p.dob)p.age=age(p.dob).replace("y","");delete p.mrn;delete p.dob;touch(id);}}const list=ordered();
  if(!list.length)showExamples();
  else if(!S.patients[S.cur])S.cur=list[0][0];
  renderAll();}

renderAll();
(async function boot(){
  if(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY)return bootSupabase();
  if(!window.claude||!window.claude.use)return useLocal();
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);}catch(e){}
  let me=null;try{me=user&&user.id?await user.id():null;}catch(e){}
  if(!db||!me)return useLocal();
  try{S.col=db.collection("data/users/"+me);}catch(e){return useLocal();}
  S.db=db;S.mode="cloud";let first=true;
  window.claude.use("assets").then(a=>{S.assets=a;if(document.getElementById("rsheet")==null)renderMain();}).catch(()=>{});
  S.col.onSnapshot(snap=>{
    const before=S.cur&&S.patients[S.cur]?JSON.stringify(S.patients[S.cur]):null;
    const seen=new Set();
    for(const d of snap.docs){seen.add(d.id);if(S.dirty.has(d.id)||S.writing[d.id])continue;S.patients[d.id]=JSON.parse(JSON.stringify(d.data()));}
    for(const id of Object.keys(S.patients))if(!seen.has(id)&&!S.dirty.has(id)&&!S.writing[id]&&!snap.metadata.fromCache)delete S.patients[id];
    if(first){first=false;
      /* carry over anything saved on this device before sign-in */
      const local=lsGet(LS_KEY);if(local&&!snap.size&&Object.keys(local).length){for(const [id,p] of Object.entries(local)){S.patients[id]=p;touch(id);}}
      afterLoad();return;}
    if(ordered().length&&isEx(S.cur)){S.examples=null;S.cur=ordered()[0][0];renderAll();return;}
    renderSidebar();
    const after=S.cur&&S.patients[S.cur]?JSON.stringify(S.patients[S.cur]):null;
    if(before!==after&&!main.contains(document.activeElement))renderMain();
    if(S.cur&&!isEx(S.cur)&&!S.patients[S.cur]){const l=ordered();if(l.length)S.cur=l[0][0];else showExamples();renderAll();}
  },err=>{console.warn(err);setStatus("local","Sync stopped. Reload the page.");});
})();
})();
</script>
